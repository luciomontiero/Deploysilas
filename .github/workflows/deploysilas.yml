name: DeploySilas

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint php-cli

      - name: PHP lint
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Composer validate
        run: |
          if [ -f composer.json ]; then
            composer validate --strict
          fi

      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/deploysilas scripts/lib/*.sh

      - name: YAML validation
        run: yamllint .github/workflows/deploysilas.yml .gitlab-ci.yml

      - name: Permission validation
        run: tests/permissions.sh

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOYSILAS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploysilas
          chmod 600 ~/.ssh/deploysilas
          ssh-keyscan -p "${{ secrets.DEPLOYSILAS_SSH_PORT || 22 }}" "${{ secrets.DEPLOYSILAS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploysilas \
            -p "${{ secrets.DEPLOYSILAS_SSH_PORT || 22 }}" \
            "${{ secrets.DEPLOYSILAS_SSH_USER }}@${{ secrets.DEPLOYSILAS_SSH_HOST }}" \
            "cd /home/ocgtechcom/silas.ocgtech.com.br && deploysilas deploy"
