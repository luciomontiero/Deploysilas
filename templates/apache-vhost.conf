<VirtualHost *:80>
    ServerName silas.ocgtech.com.br
    DocumentRoot /home/ocgtechcom/silas.ocgtech.com.br

    <Directory /home/ocgtechcom/silas.ocgtech.com.br>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/silas-error.log
    CustomLog ${APACHE_LOG_DIR}/silas-access.log combined
</VirtualHost>
