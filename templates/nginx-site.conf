server {
    listen 80;
    server_name silas.ocgtech.com.br;
    root /home/ocgtechcom/silas.ocgtech.com.br;
    index index.php index.html;

    access_log /var/log/nginx/silas-access.log;
    error_log /var/log/nginx/silas-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
